expose_php = Off
date.timezone = UTC
cgi.fix_pathinfo = 0
realpath_cache_size = 4096k
realpath_cache_ttl = 120
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.validate_permission = 1
opcache.validate_root = 1

; Security hardening: php.net Oct 2026 advisory (mitigates CVE-2026-115560 & CVE-2026-109619)
session.upload_progress.enabled = 0

; Disable dangerous command execution and process spawning functions by default
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,show_source,pcntl_exec
