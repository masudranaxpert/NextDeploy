# Gated CI & rolling :latest image build for the main branch.
# - PRs & pushes run TypeScript typecheck, Go vet, -race tests (panel + cmd/nd), and cross-compile checks.
# - Only pushes to main (or manual dispatch) build and push :latest AFTER all checks pass.
name: CI & Docker (main)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/nextdeploy

jobs:
  ci:
    name: Typecheck, Vet & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/nd/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm deps
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Check panel (vet, race tests, cross-build)
        run: |
          go vet ./...
          go test -race -count=1 ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /dev/null .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /dev/null .

      - name: Check nd CLI (vet, race tests, cross-build)
        working-directory: cmd/nd
        run: |
          go vet ./...
          go test -race -count=1 ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /dev/null .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /dev/null .

      - name: Check shell script syntax
        run: bash -n install.sh install-nd.sh uninstall.sh migrate.sh

  build-push:
    name: Build & push main image (latest)
    needs: ci
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Build fresh frontend bundle
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Resolve latest omp version
        id: omp_version
        run: |
          URL=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/can1357/oh-my-pi/releases/latest || true)
          TAG="${URL##*/}"
          case "$TAG" in v*) ;; *) TAG=latest ;; esac
          echo "omp_version=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OMP_VERSION=${{ steps.omp_version.outputs.tag }}
          tags: ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=NextDeploy
            org.opencontainers.image.description=NextDeploy panel (main branch — rolling latest)
            org.opencontainers.image.url=https://github.com/masudranaxpert/NextDeploy
            org.opencontainers.image.source=https://github.com/masudranaxpert/NextDeploy/tree/main
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
