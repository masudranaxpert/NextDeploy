name: Release

# Trigger:
#   - push a tag like v1.0.0  → runs CI, builds multi-arch image & CLI/server binaries, creates GitHub Release
#   - push/PR to main-v2 or php-panel → CI build check (no image push)
#   - push/PR to main is handled by docker-main.yml (gated CI + rolling :latest image)
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main-v2
      - php-panel
  pull_request:
    branches:
      - main-v2
      - php-panel

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/nextdeploy

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build & push Docker image, then create a GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Build, push & release
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # needed to create GitHub Release
      packages: write

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Extract version from tag ───────────────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.2.3
          VERSION="${TAG#v}"                # e.g. 1.2.3
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $TAG ($VERSION)"

      # ── Set up QEMU (multi-arch: amd64 + arm64) ───────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── Set up Docker Buildx ──────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Log in to Docker Hub ──────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Resolve latest omp version
        id: omp_version
        run: |
          URL=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/can1357/oh-my-pi/releases/latest || true)
          TAG="${URL##*/}"
          case "$TAG" in v*) ;; *) TAG=latest ;; esac
          echo "omp_version=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ── Build & push image ────────────────────────────────────────────────────
      # Tags pushed (DOCKER_USERNAME from secrets):
      #   <user>/nextdeploy:v1.2.3   ← git tag
      #   <user>/nextdeploy:1.2.3    ← semver without v prefix
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OMP_VERSION=${{ steps.omp_version.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=NextDeploy
            org.opencontainers.image.description=Fast self-hosted deployment platform built with Go & Caddy
            org.opencontainers.image.url=https://github.com/masudranaxpert/NextDeploy
            org.opencontainers.image.source=https://github.com/masudranaxpert/NextDeploy
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Delete older Docker Hub release tags (keep only last 5 versions) ───────
      # Keeps both vX.Y.Z and X.Y.Z tags for the newest 5 releases.
      - name: Clean up old Docker Hub tags
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          IMAGE: nextdeploy
        run: |
          set -euo pipefail

          # Authenticate and get a JWT
          TOKEN=$(curl -s -X POST \
            "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKER_USERNAME}\",\"password\":\"${DOCKER_TOKEN}\"}" \
            | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::warning::Could not authenticate with Docker Hub — skipping tag cleanup."
            exit 0
          fi

          # Fetch all tags (paginated), then keep the highest 5 semantic versions.
          LIST=$(mktemp)
          URL="https://hub.docker.com/v2/repositories/${DOCKER_USERNAME}/${IMAGE}/tags?page_size=100&ordering=last_updated"
          while [ -n "$URL" ]; do
            RESP=$(curl -sS -H "Authorization: Bearer ${TOKEN}" "$URL")
            echo "$RESP" | jq -r '.results[].name' >> "$LIST"
            URL=$(echo "$RESP" | jq -r 'if .next == null then empty else .next end')
          done

          mapfile -t RELEASE_TAGS < <(grep -E '^(v)?[0-9]+\.[0-9]+\.[0-9]+$' "$LIST" || true)
          rm -f "$LIST"

          if [ "${#RELEASE_TAGS[@]}" -eq 0 ]; then
            echo "No release tags found."
            exit 0
          fi

          # Keep the highest 5 release versions and preserve both tag forms.
          KEEP=5
          declare -A KEEP_VERSIONS=()
          mapfile -t UNIQUE_VERSIONS < <(printf '%s\n' "${RELEASE_TAGS[@]}" | sed 's/^v//' | sort -uV)
          START=0
          if [ "${#UNIQUE_VERSIONS[@]}" -gt "$KEEP" ]; then
            START=$((${#UNIQUE_VERSIONS[@]} - KEEP))
          fi
          for ((i=START; i<${#UNIQUE_VERSIONS[@]}; i++)); do
            KEEP_VERSIONS["${UNIQUE_VERSIONS[$i]}"]=1
          done

          TO_DELETE=()
          for TAG in "${RELEASE_TAGS[@]}"; do
            VERSION="${TAG#v}"
            if [ -z "${KEEP_VERSIONS[$VERSION]:-}" ]; then
              TO_DELETE+=("$TAG")
            fi
          done

          if [ "${#TO_DELETE[@]}" -eq 0 ]; then
            echo "Nothing to delete (≤${KEEP} release versions found)."
            exit 0
          fi

          echo "Tags to delete:"
          printf '%s\n' "${TO_DELETE[@]}"

          for TAG in "${TO_DELETE[@]}"; do
            echo "Deleting tag: $TAG"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              "https://hub.docker.com/v2/repositories/${DOCKER_USERNAME}/${IMAGE}/tags/${TAG}/" \
              -H "Authorization: Bearer ${TOKEN}")
            echo "  → HTTP $HTTP"
          done

          echo "Cleanup complete."

      # ── Build release notes from git log ──────────────────────────────────────
      - name: Generate release notes
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            CHANGES=$(git log --pretty=format:"- %s" "${PREV}..HEAD" | head -40)
          else
            CHANGES=$(git log --pretty=format:"- %s" | head -40)
          fi

          TAG="${{ steps.version.outputs.tag }}"
          IMAGE="${{ env.IMAGE_NAME }}"

          {
            echo "## What's changed"
            echo ""
            if [ -n "$CHANGES" ]; then
              echo "$CHANGES"
            else
              echo "- Initial release"
            fi
            echo ""
            echo "---"
            echo ""
            echo "**Downloads Guide**"
            echo ""
            echo "| Binary | Purpose |"
            echo "|---|---|"
            echo "| \`nd-<os>-<arch>\` | **NextDeploy CLI & Edge Shield (\`nd\` / \`nd edge\`)** — install via \`install-nd.sh\` or upgrade via \`nd edge upgrade\` |"
            echo "| \`nextdeploy-panel-<os>-<arch>\` | **NextDeploy Panel Server** (standalone binary; Docker setups pull \`${IMAGE}:${TAG}\`) |"
            echo "| \`SHA256SUMS.txt\` | SHA-256 checksums for \`nd\` release binaries |"
            echo ""
            echo "**Docker image**"
            echo '```bash'
            echo "docker pull ${IMAGE}:${TAG}"
            echo "docker pull ${IMAGE}:${{ steps.version.outputs.version }}"
            echo '```'
          } > /tmp/release_notes.md

          echo "Release notes written."

      # ── Create GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NextDeploy ${{ steps.version.outputs.tag }}"
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build nd CLI & Edge Shield binaries and attach to the GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  nd-release:
    name: Build nd CLI & Edge binaries
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build nd CLI & Edge binaries
        working-directory: cmd/nd
        run: |
          VERSION="${{ github.ref_name }}"
          PLATFORMS=(
            "linux/amd64/"
            "linux/arm64/"
            "darwin/amd64/"
            "darwin/arm64/"
            "windows/amd64/.exe"
          )
          for ENTRY in "${PLATFORMS[@]}"; do
            GOOS="${ENTRY%%/*}"
            REST="${ENTRY#*/}"
            GOARCH="${REST%%/*}"
            SUFFIX="${REST#*/}"
            OUT="nd-${GOOS}-${GOARCH}${SUFFIX}"
            echo "Building ${OUT}..."
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X nd/cmd.Version=${VERSION}" -o "${OUT}" .
          done
          sha256sum nd-* > SHA256SUMS.txt

      - name: Upload nd binaries & checksums to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            cmd/nd/nd-*
            cmd/nd/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Build NextDeploy Panel server binaries (Linux & macOS) and attach to Release
  # ─────────────────────────────────────────────────────────────────────────────
  nextdeploy-release:
    name: Build NextDeploy Panel binaries
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm deps
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Build NextDeploy Panel binaries
        run: |
          VERSION="${{ github.ref_name }}"
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )
          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS="${PLATFORM%/*}"
            GOARCH="${PLATFORM#*/}"
            OUT="nextdeploy-panel-${GOOS}-${GOARCH}"
            echo "Building ${OUT}..."
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "${OUT}" .
          done

      - name: Upload NextDeploy Panel binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: nextdeploy-panel-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Pre-release & legacy branch CI check
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: Build check (CI)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/nd/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm deps
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Go build (panel Linux)
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /dev/null .

      - name: Go build (panel macOS / darwin)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /dev/null .

      - name: Go vet & test (panel)
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Go build & test (nd CLI)
        working-directory: cmd/nd
        run: |
          go vet ./...
          go test -race -count=1 ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /dev/null .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /dev/null .
