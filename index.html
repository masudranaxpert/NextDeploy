<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>NextDeploy — Modern Docker Compose & PaaS Control Plane</title>
    <meta name="description" content="Self-hosted Docker Compose deployment platform with automatic Caddy HTTPS, container topology, live PTY terminal, and MCP server." />
    <meta property="og:title" content="NextDeploy" />
    <meta property="og:description" content="Self-hosted Docker Compose deployment platform with automatic Caddy HTTPS, container topology, live PTY terminal, and MCP server." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts must never block the first paint: load them without blocking, the text shows in a system font first -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"></noscript>
    <style>
      /* shown from the first byte, until the app takes over #root */
      .nd-splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#09090b;color:#a1a1aa;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
      .nd-splash b{display:flex;width:48px;height:48px;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(249,115,22,.2);background:rgba(249,115,22,.1);color:#fb923c;font-size:18px}
      .nd-splash i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(249,115,22,.25);border-top-color:#fb923c;animation:nd-spin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:10px}
      @keyframes nd-spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      // Ask for the page data right away, in parallel with downloading the app code.
      (function () {
        var p = location.pathname;
        if (p === '/login' || p === '/setup') return;
        window.__ndBoot = fetch('/api/panel/bootstrap', {
          credentials: 'same-origin',
          headers: { Accept: 'application/json', 'X-Requested-With': 'XMLHttpRequest', 'X-NextDeploy-Client': 'spa' }
        }).catch(function () { return null; });
      })();
    </script>
  </head>
  <body class="bg-[#09090b] text-[#fafafa] antialiased selection:bg-orange-500/30 selection:text-orange-200">
    <div id="root"><div class="nd-splash"><b>ND</b><span><i></i>Loading NextDeploy…</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
