{
    admin {
        listen "127.0.0.1:8081"
    }
    http {
        protocols h1 h2
    }
}

localhost:8443 {
    tls /etc/ferron/certs/cert.pem /etc/ferron/certs/key.pem
    match static_req {
        request.uri.path ~ r"^/static/"
    }
    if static_req {
        root /srv
        rewrite r"^/static/(.*)$" "/$1"
    }
    if_not static_req {
        proxy {
            upstream http://app:8080 {
                logical_dns true
            }
            retry_interval "0.2s"
        }
    }
}
